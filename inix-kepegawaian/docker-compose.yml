version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: inix-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inix_db
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: inix-backend
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: inix_db
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: inix-jwt-secret-key-for-testing
      JWT_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      NODE_ENV: development
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npm run seed && node src/app.js"

  frontend:
    build: ./frontend
    container_name: inix-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
